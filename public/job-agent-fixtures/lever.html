<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Automation Analyst - Western Operations</title>
    <link rel="stylesheet" href="/job-agent-fixtures/fixture.css" />
  </head>
  <body data-portal="lever">
    <main class="posting-page">
      <article class="card posting-headline">
        <p class="eyebrow" data-company-name>Western Operations</p>
        <h2 data-job-title>Automation Analyst</h2>
        <div class="posting-categories">
          <p class="location" data-job-location>Perth, WA · Onsite</p>
        </div>
        <div class="content" data-job-description>
          Improve real operational workflows using JavaScript, SQL, dashboards,
          and thoughtful stakeholder collaboration.
        </div>
      </article>
      <section class="card lever-job-application">
        <h2>Lever-style application</h2>
        <form>
          <div class="fields">
            <div class="field wide">
              <label for="lever-name">Full name</label>
              <input id="lever-name" name="name" required />
            </div>
            <div class="field">
              <label for="lever-email">Email</label>
              <input id="lever-email" name="email" type="email" required />
            </div>
            <div class="field">
              <label for="lever-phone">Phone</label>
              <input id="lever-phone" name="phone" type="tel" required />
            </div>
            <div class="field wide">
              <label for="lever-location">Current location</label>
              <input id="lever-location" name="location" required />
            </div>
            <div class="field wide">
              <label for="lever-linkedin">LinkedIn</label>
              <input id="lever-linkedin" name="linkedin" type="url" />
            </div>
            <div class="field wide">
              <label for="lever-resume">Resume</label>
              <input id="lever-resume" name="resume" type="file" />
            </div>
            <div class="field wide">
              <label for="lever-note">Additional information (optional)</label>
              <textarea id="lever-note" name="comments"></textarea>
            </div>
          </div>
          <button type="submit">Send application</button>
        </form>
      </section>
    </main>
  </body>
</html>
